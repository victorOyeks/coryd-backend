server:
  port: 9105
  forward-headers-strategy: framework
  servlet:
    context-path: /notification

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=notification
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notification
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      # No group-id here on purpose - KafkaConfig defines one group per concern (otp / trip /
      # safety / admin) and every @KafkaListener names its own, so a wedged consumer on one
      # concern can no longer stall the others. The rest of the consumer is configured in
      # KafkaConfig rather than split across both places.
      #
      # latest, not earliest: a notification has a shelf life. After any outage - or on the first
      # boot of a newly-named group - replaying the broker's full 48h retention would text every
      # user a pile of long-expired OTPs and "driver has arrived" alerts for trips that ended two
      # days ago. Better to skip a stale backlog than to deliver it. The cost is that messages
      # produced while a group has no committed offset at all are missed, which is only ever a
      # few seconds during the one deploy that introduces the new group ids.
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

termii:
  base-url: https://api.ng.termii.com
  enabled: ${TERMII_ENABLED:false}
  api-key: ${TERMII_API_KEY:placeholder}
  sender-id: ${TERMII_SENDER_ID:OE Alert}

# WhatsApp (docs/whatsapp-notifications.md). Off by default; when on, a notification goes by WhatsApp only if
# its template id below is set, and falls back to SMS when WhatsApp refuses or fails - never both.
whatsapp:
  enabled: ${WHATSAPP_ENABLED:false}
  provider: ${WHATSAPP_PROVIDER:termii}
  termii:
    base-url: ${WHATSAPP_TERMII_BASE_URL:https://api.ng.termii.com}
    api-key: ${WHATSAPP_TERMII_API_KEY:${TERMII_API_KEY:placeholder}}
    device-id: ${WHATSAPP_TERMII_DEVICE_ID:}
  templates:
    otp: ${WHATSAPP_TEMPLATE_OTP:}
    trip-share: ${WHATSAPP_TEMPLATE_TRIP_SHARE:}
    sos-contact: ${WHATSAPP_TEMPLATE_SOS_CONTACT:}
    sos-ops: ${WHATSAPP_TEMPLATE_SOS_OPS:}
    safety-escalated: ${WHATSAPP_TEMPLATE_SAFETY_ESCALATED:}

spring.mail:
  host: ${SMTP_HOST:localhost}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:placeholder}
  password: ${SMTP_PASSWORD:placeholder}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        # JavaMail defaults every one of these to infinite. Without them a single unresponsive
        # SMTP server parks a notification-dispatch thread permanently, and enough of those
        # silently take the whole pool - and therefore all notification delivery - down while
        # the service still reports healthy.
        connectiontimeout: 5000
        timeout: 10000
        writetimeout: 10000

mail:
  from-address: ${MAIL_FROM_ADDRESS:no-reply@coryd.ng}
  from-name: ${MAIL_FROM_NAME:CoRyd}

services:
  trip:
    url: ${TRIP_SERVICE_URL:http://localhost:9103/trip}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9104/payment}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  internal:
    api-key: ${INTERNAL_API_KEY}

# Every SOS texts each ops phone and emails each ops address (comma-separated), as well as the
# emergency contacts of whoever pressed it.
sos:
  ops-phones: ${SOS_OPS_PHONES:}
  ops-emails: ${SOS_OPS_EMAILS:}

# Ops reports. All three fire at 06:00 in report.timezone; recipients is comma-separated.
report:
  enabled: ${REPORT_ENABLED:true}
  timezone: ${REPORT_TIMEZONE:Africa/Lagos}
  recipients: ${REPORT_RECIPIENTS:hello@coryd.ng}
  logo-url: ${REPORT_LOGO_URL:}

# NDPC registration tiers: ops (REPORT_RECIPIENTS) is emailed once when the number of people we hold data
# about nears a tier (warn-percent of it) and once when it reaches it. Tiers/fees are in NdpcThresholdProperties.
ndpc:
  enabled: ${NDPC_ALERTS_ENABLED:true}
  warn-percent: ${NDPC_WARN_PERCENT:80}
  cron: ${NDPC_CHECK_CRON:0 30 6 * * *}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

management:
  endpoints:
    web:
      exposure:
        # metrics alongside health so consumer lag is observable without a restart-and-guess:
        # /actuator/metrics/kafka.consumer.fetch.manager.records.lag.max is the number to alert
        # on - it going non-zero and staying there is the earliest signal that notifications
        # have stopped being delivered.
        include: health,metrics
  endpoint:
    health:
      # The kafkaConsumers indicator is the point of this endpoint for this service - seeing
      # WHICH listener stopped is what makes the alert actionable.
      show-details: always
  health:
    mail:
      # Email is best-effort, same as SMS/push (EmailService already logs and
      # returns false on failure rather than throwing) - an unreachable/
      # unconfigured SMTP server must not flip the whole service to DOWN.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
