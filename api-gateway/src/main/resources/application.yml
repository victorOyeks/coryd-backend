server:
  port: 9100
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # ── Identity ──────────────────────────────────────────────────────────
        - id: identity-service
          uri: http://${IDENTITY_HOST:localhost}:9101
          predicates:
            - Path=/identity/**

        # ── Profile ───────────────────────────────────────────────────────────
        - id: profile-service
          uri: http://${PROFILE_HOST:localhost}:9102
          predicates:
            - Path=/profile/**

        # ── Trip ──────────────────────────────────────────────────────────────
        - id: trip-service
          uri: http://${TRIP_HOST:localhost}:9103
          predicates:
            - Path=/trip/**

        # ── Payment ───────────────────────────────────────────────────────────
        - id: payment-service
          uri: http://${PAYMENT_HOST:localhost}:9104
          predicates:
            - Path=/payment/**

        # ── Notification ──────────────────────────────────────────────────────
        - id: notification-service
          uri: http://${NOTIFICATION_HOST:localhost}:9105
          predicates:
            - Path=/notification/**

# No separate /docs/<service>/** rewrite routes: every service's context-path
# already equals its route prefix (/identity, /profile, ...), so the plain
# routes above already forward /identity/v3/api-docs straight through
# unchanged. A rewrite layer here was actively harmful - Spring Cloud
# Gateway's forwarded-prefix handling for a RewritePath route leaked the
# route's own prefix ("/docs") into Springdoc's computed "servers" URL
# instead of the service's real context-path.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity-service
        url: /identity/v3/api-docs
      - name: profile-service
        url: /profile/v3/api-docs
      - name: trip-service
        url: /trip/v3/api-docs
      - name: payment-service
        url: /payment/v3/api-docs
      - name: notification-service
        url: /notification/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
