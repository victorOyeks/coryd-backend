server:
  port: 9104
  forward-headers-strategy: framework
  servlet:
    context-path: /payment

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=payment
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-payment-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_placeholder}
  base-url: https://api.paystack.co

services:
  # Rider name/photo for the Wallet feed's trip rows (ProfileServiceClient).
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  internal:
    api-key: ${INTERNAL_API_KEY}

commission:
  percentage: ${COMMISSION_PERCENTAGE:0.05}

# Destructive test-only endpoints (see org.coryd.payment.dev). Off unless explicitly enabled.
coryd:
  dev-tools:
    enabled: ${DEV_TOOLS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
