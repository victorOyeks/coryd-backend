server:
  port: 9104
  servlet:
    context-path: /payment

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=payment
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-payment-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_placeholder}
  base-url: https://api.paystack.co

commission:
  percentage: ${COMMISSION_PERCENTAGE:0.15}

payout:
  cron: ${PAYOUT_CRON:0 0 4 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
