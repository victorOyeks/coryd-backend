server:
  port: 9104
  forward-headers-strategy: framework
  servlet:
    context-path: /payment

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=payment
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: payment
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-payment-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Every fare is split at charge time: the driver's share goes to their Paystack subaccount and
# settles to their bank on the schedule below. Settlements are mirrored for the earnings screen.
payment:
  # A driver owing more than this from refunded trips can't post routes until they pay it back.
  driver-owed-limit: ${DRIVER_OWED_LIMIT:10000}
  settlement-sync:
    cron: ${PAYMENT_SETTLEMENT_SYNC_CRON:0 15 */6 * * *}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_placeholder}
  base-url: https://api.paystack.co
  # auto (T+1), weekly or monthly - never manual, which is conditional release by another name.
  settlement-schedule: ${PAYSTACK_SETTLEMENT_SCHEDULE:weekly}
  # Who pays the fee on a split charge. Verify against a real test-mode split before going live -
  # left unset, Paystack bills the main account, which is more than our commission on a 2,500 fare.
  split-fee-bearer: ${PAYSTACK_SPLIT_FEE_BEARER:}
  # Test environments only: send bank accounts to Paystack as its test bank (001) so test mode's
  # 3 real bank lookups a day aren't used up. Ignored with a live key.
  test-bank-code: ${PAYSTACK_TEST_BANK_CODE:}
  # Test environments only: one subaccount made by hand in Paystack's test dashboard, used for every
  # driver (Paystack's test bank won't take a subaccount). Ignored with a live key.
  test-subaccount-code: ${PAYSTACK_TEST_SUBACCOUNT_CODE:}

services:
  # Rider name/photo for the earnings screen's trip rows (ProfileServiceClient).
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  # The booking a payment is for - its fare, rider and driver are read from here, never from the client.
  trip:
    url: ${TRIP_SERVICE_URL:http://localhost:9103/trip}
  internal:
    api-key: ${INTERNAL_API_KEY}

commission:
  percentage: ${COMMISSION_PERCENTAGE:0.05}

# Destructive test-only endpoints (see org.coryd.payment.dev). Off unless explicitly enabled.
coryd:
  dev-tools:
    enabled: ${DEV_TOOLS_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
