name: Deploy to Dev VPS

on:
  push:
    branches: [develop]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api-gateway:
              - 'api-gateway/**'

            identity-service:
              - 'identity-service/**'
              - 'common/src/main/java/org/coryd/common/entity/**'
              - 'common/src/main/java/org/coryd/common/exception/**'
              - 'common/src/main/java/org/coryd/common/response/**'
              - 'common/src/main/java/org/coryd/common/security/**'
              - 'common/src/main/java/org/coryd/common/instrumentation/**'
              - 'common/src/main/java/org/coryd/common/config/**'
              - 'common/src/main/java/org/coryd/common/kafka/**'
              - 'common/src/main/java/org/coryd/common/enums/UserRole.java'
              - 'common/src/main/java/org/coryd/common/enums/OtpChannel.java'
              - 'common/src/main/java/org/coryd/common/enums/OtpPurpose.java'

            profile-service:
              - 'profile-service/**'
              - 'common/src/main/java/org/coryd/common/entity/**'
              - 'common/src/main/java/org/coryd/common/exception/**'
              - 'common/src/main/java/org/coryd/common/response/**'
              - 'common/src/main/java/org/coryd/common/security/**'
              - 'common/src/main/java/org/coryd/common/instrumentation/**'
              - 'common/src/main/java/org/coryd/common/config/**'
              - 'common/src/main/java/org/coryd/common/kafka/**'
              - 'common/src/main/java/org/coryd/common/enums/VerificationStatus.java'

            trip-service:
              - 'trip-service/**'
              - 'common/src/main/java/org/coryd/common/entity/**'
              - 'common/src/main/java/org/coryd/common/exception/**'
              - 'common/src/main/java/org/coryd/common/response/**'
              - 'common/src/main/java/org/coryd/common/security/**'
              - 'common/src/main/java/org/coryd/common/instrumentation/**'
              - 'common/src/main/java/org/coryd/common/config/**'
              - 'common/src/main/java/org/coryd/common/kafka/**'
              - 'common/src/main/java/org/coryd/common/enums/BookingStatus.java'
              - 'common/src/main/java/org/coryd/common/enums/IssueCategory.java'
              - 'common/src/main/java/org/coryd/common/enums/RatingDirection.java'
              - 'common/src/main/java/org/coryd/common/enums/RouteStatus.java'
              - 'common/src/main/java/org/coryd/common/enums/VerificationStatus.java'
              - 'common/src/main/java/org/coryd/common/enums/TripHistoryStatus.java'
              - 'common/src/main/java/org/coryd/common/enums/SavedPlaceType.java'

            payment-service:
              - 'payment-service/**'
              - 'common/src/main/java/org/coryd/common/entity/**'
              - 'common/src/main/java/org/coryd/common/exception/**'
              - 'common/src/main/java/org/coryd/common/response/**'
              - 'common/src/main/java/org/coryd/common/security/**'
              - 'common/src/main/java/org/coryd/common/instrumentation/**'
              - 'common/src/main/java/org/coryd/common/config/**'
              - 'common/src/main/java/org/coryd/common/kafka/**'
              - 'common/src/main/java/org/coryd/common/enums/PaymentMethod.java'
              - 'common/src/main/java/org/coryd/common/enums/PaymentPurpose.java'
              - 'common/src/main/java/org/coryd/common/enums/PayoutStatus.java'
              - 'common/src/main/java/org/coryd/common/enums/WalletEntryType.java'

            notification-service:
              - 'notification-service/**'
              - 'common/src/main/java/org/coryd/common/entity/**'
              - 'common/src/main/java/org/coryd/common/exception/**'
              - 'common/src/main/java/org/coryd/common/response/**'
              - 'common/src/main/java/org/coryd/common/security/**'
              - 'common/src/main/java/org/coryd/common/instrumentation/**'
              - 'common/src/main/java/org/coryd/common/config/**'
              - 'common/src/main/java/org/coryd/common/kafka/**'
              - 'common/src/main/java/org/coryd/common/enums/NotificationChannel.java'
              - 'common/src/main/java/org/coryd/common/enums/OtpChannel.java'
              - 'common/src/main/java/org/coryd/common/enums/OtpPurpose.java'

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: mvn -pl ${{ matrix.service }} -am package -DskipTests -q

      # Ships the jar straight to the VPS over SSH instead of going through
      # actions/upload-artifact - GitHub's per-org Artifact storage has a hard
      # quota that a multi-service matrix build chews through fast, and none
      # of these jars need to live anywhere but the target host anyway.
      - name: SCP jar to Dev VPS
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEV_VPS_HOST }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${{ secrets.DEV_VPS_USER }}@${{ secrets.DEV_VPS_HOST }}" \
            "mkdir -p /opt/coryd-dev/${{ matrix.service }}"
          jar=$(ls ${{ matrix.service }}/target/*.jar | head -1)
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new \
            "$jar" \
            "${{ secrets.DEV_VPS_USER }}@${{ secrets.DEV_VPS_HOST }}:/opt/coryd-dev/${{ matrix.service }}/app-new.jar"
          rm -f ~/.ssh/deploy_key

  deploy:
    needs: [detect-changes, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          CHANGED_SERVICES: ${{ needs.detect-changes.outputs.services }}
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USER }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          envs: CHANGED_SERVICES
          command_timeout: 30m
          # Restart order matches dependency order: identity -> profile -> trip -> payment ->
          # notification -> api-gateway last (so the gateway only ever routes to backends
          # that are already on the new version). Each service gets a health-checked
          # restart with automatic rollback if it doesn't come back up.
          script: |
            set -e
            changed=$(echo "$CHANGED_SERVICES" | tr -d '[]" ' | tr ',' '\n')
            echo "Changed services: $(echo $changed | tr '\n' ' ')"

            declare -A health_urls
            health_urls["identity-service"]="http://localhost:9101/identity/actuator/health"
            health_urls["profile-service"]="http://localhost:9102/profile/actuator/health"
            health_urls["trip-service"]="http://localhost:9103/trip/actuator/health"
            health_urls["payment-service"]="http://localhost:9104/payment/actuator/health"
            health_urls["notification-service"]="http://localhost:9105/notification/actuator/health"
            health_urls["api-gateway"]="http://localhost:9100/actuator/health"

            ordered=(
              identity-service
              profile-service
              trip-service
              payment-service
              notification-service
              api-gateway
            )

            for svc in "${ordered[@]}"; do
              if ! echo "$changed" | grep -qx "$svc"; then
                echo "  — $svc unchanged, skipping"
                continue
              fi

              if [ ! -f "/opt/coryd-dev/$svc/app-new.jar" ]; then
                echo "  ✗ No JAR found for $svc"
                exit 1
              fi

              echo "→ Deploying $svc"

              [ -f /opt/coryd-dev/$svc/app.jar ] && \
                cp /opt/coryd-dev/$svc/app.jar /opt/coryd-dev/$svc/app.jar.bak

              mv /opt/coryd-dev/$svc/app-new.jar /opt/coryd-dev/$svc/app.jar

              sudo systemctl restart coryd-$svc

              ok=false
              for i in $(seq 1 60); do
                status=$(wget -qO- "${health_urls[$svc]}" 2>/dev/null | grep -o '"status":"UP"' || echo "")
                if [ -n "$status" ]; then
                  echo "  ✓ $svc healthy"
                  ok=true
                  break
                fi
                sleep 5
              done

              if [ "$ok" = "false" ]; then
                echo "  ✗ $svc did not become healthy in 300s — rolling back"
                [ -f /opt/coryd-dev/$svc/app.jar.bak ] && \
                  cp /opt/coryd-dev/$svc/app.jar.bak /opt/coryd-dev/$svc/app.jar
                sudo systemctl restart coryd-$svc
                exit 1
              fi

              rm -f /opt/coryd-dev/$svc/app.jar.bak
            done

            echo "✓ Dev deployment complete"
