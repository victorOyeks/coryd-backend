server:
  port: 9101
  forward-headers-strategy: framework
  servlet:
    context-path: /identity

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=identity
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: identity
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-identity-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  trip:
    url: ${TRIP_SERVICE_URL:http://localhost:9103/trip}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9104/payment}
  internal:
    api-key: ${INTERNAL_API_KEY}

coryd:
  token-revocation:
    # identity-service reads its own database for the revocation snapshot (LocalTokenRevocationSource) - no HTTP call to itself.
    http-bootstrap:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
