server:
  port: 9103
  forward-headers-strategy: framework
  servlet:
    context-path: /trip

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: trip-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=trip
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trip
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-trip-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Shared Redis instance (marketrun-ng uses DB 0 by default) - CoRyd gets
      # its own logical DB so live-location keys never collide with theirs.
      database: ${REDIS_DATABASE:1}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api

matching:
  time-tolerance-minutes: 60
  geo-tolerance-meters: 4000
  min-fare-reports: 5

cancellation:
  free-cancellation-window-hours: 2
  late-fee-percentage: 0.50

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
