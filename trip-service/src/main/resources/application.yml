server:
  port: 9103
  forward-headers-strategy: framework
  servlet:
    context-path: /trip

spring:
  # Scheduled jobs share this pool. One thread (Spring's default) would let a slow job - regular routes
  # calling Maps, demand alerts - hold up the safety checks' every-minute escalation.
  task:
    scheduling:
      pool:
        size: 4
  config:
    import: optional:file:.env[.properties]

  application:
    name: trip-service
  datasource:
    # trip first (its tables, Liquibase's log); public second, where PostGIS's types and functions live.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=trip,public
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: trip
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-trip-service
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Shared Redis instance (marketrun-ng uses DB 0 by default) - CoRyd gets
      # its own logical DB so live-location keys never collide with theirs.
      database: ${REDIS_DATABASE:1}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9104/payment}
  internal:
    api-key: ${INTERNAL_API_KEY}

# Destructive test-only endpoints (see org.coryd.trip.dev). Off unless explicitly enabled -
# with the flag absent the beans are never registered, so the paths do not exist at all.
coryd:
  dev-tools:
    enabled: ${DEV_TOOLS_ENABLED:false}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api

matching:
  time-tolerance-minutes: ${MATCHING_TIME_TOLERANCE_MINUTES:60}
  geo-tolerance-meters: ${MATCHING_GEO_TOLERANCE_METERS:2000}
  min-fare-reports: 5
  # Along the way: riders whose start and end are both within walk-meters of a driver's road, in order.
  # Off also lifts the "pickup must be on the driver's road" booking rule - e.g. until the app sends it.
  along-route-enabled: ${MATCHING_ALONG_ROUTE_ENABLED:true}
  walk-meters: ${MATCHING_WALK_METERS:1000}
  # Longest trip assumed when looking for routes that pass a rider after they left their start.
  max-trip-minutes: ${MATCHING_MAX_TRIP_MINUTES:240}
  # Ask PostGIS for along-the-way candidates when it's installed; false forces the in-memory path.
  use-postgis: ${MATCHING_USE_POSTGIS:true}
  # Riders can book until the driver taps Start, or this many minutes after the departure time if they haven't.
  booking-grace-minutes: ${BOOKING_GRACE_MINUTES:10}

# STRICT (default): nobody books (riders) or posts (drivers) until their NIN + selfie check is approved.
# OFF only where nobody can be verified yet.
identity:
  verification:
    enforcement: ${IDENTITY_VERIFICATION_ENFORCEMENT:STRICT}

# Unverified drivers may post routes for grace-period-days after their first one. Flip to STRICT
# once ops can approve drivers; OFF disables the gate entirely.
driver:
  verification:
    enforcement: ${DRIVER_VERIFICATION_ENFORCEMENT:GRACE}
    grace-period-days: ${DRIVER_VERIFICATION_GRACE_DAYS:30}
    # APPROVED: ops must approve the government ID and vehicle before a driver can post. Requires
    # someone actually reviewing - SUBMITTED drops the bar to "uploaded" if that stalls.
    prerequisite-level: ${DRIVER_PREREQUISITE_LEVEL:APPROVED}

cancellation:
  free-cancellation-window-hours: 2
  late-fee-percentage: 0.25

share:
  link:
    secret: ${SHARE_LINK_SECRET:change-me-in-every-environment}
    base-url: ${SHARE_LINK_BASE_URL:https://api.coryd.ng/trip}

app:
  testing:
    bypass-time-gates: ${BYPASS_TIME_GATES:false}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Routes cannot depart further ahead than the payout settlement cycle
trip:
  max-days-ahead: ${TRIP_MAX_DAYS_AHEAD:3}
  # A driver running late moves their trip instead of cancelling. Once riders have booked: later only, at most
  # max-minutes past what they booked and max-count times; a rider moved more than free-cancel-minutes cancels free.
  # The Ops Console's driver index (profile-service) gets each driver's trips, rating, reliability and reports when they
  # change, and every driver again nightly. sync-on-startup fills it on a fresh deploy.
  driver-stats:
    sync-cron: ${DRIVER_STATS_SYNC_CRON:0 30 2 * * *}
    sync-on-startup: ${DRIVER_STATS_SYNC_ON_STARTUP:true}
  # The same for the rider index (Riders Directory): trips, rating, reliability, reports and spend.
  rider-stats:
    sync-cron: ${RIDER_STATS_SYNC_CRON:0 35 2 * * *}
    sync-on-startup: ${RIDER_STATS_SYNC_ON_STARTUP:true}
  # "You saved about N compared with a solo cab" on a rider's booking: base + per road km, roughly a solo ride-hailing fare.
  savings:
    enabled: ${SAVINGS_ENABLED:true}
    solo-cab-base-fare: ${SOLO_CAB_BASE_FARE:700}
    solo-cab-per-km: ${SOLO_CAB_RATE_PER_KM:200}
  time-change:
    max-minutes: ${TRIP_TIME_CHANGE_MAX_MINUTES:120}
    max-count: ${TRIP_TIME_CHANGE_MAX_COUNT:3}
    free-cancel-minutes: ${TRIP_TIME_CHANGE_FREE_CANCEL_MINUTES:15}
    last-minute-minutes: ${TRIP_TIME_CHANGE_LAST_MINUTE_MINUTES:60}
  # Fare suggested to drivers while posting: whole-route km x per-km, rounded, never below the minimum.
  fare:
    per-km: ${FARE_PER_KM:100}
    minimum: ${FARE_MINIMUM:500}
    round-to: ${FARE_ROUND_TO:100}
  # Regular routes: how often each driver's upcoming trips are posted (Lagos time).
  route-templates:
    cron: ${ROUTE_TEMPLATES_CRON:0 5 * * * *}
  # "Are you OK?" checks on trips in progress - see TripSafetyProperties.
  safety:
    enabled: ${TRIP_SAFETY_ENABLED:true}
    stop-radius-meters: ${TRIP_SAFETY_STOP_RADIUS_METERS:50}
    stop-minutes: ${TRIP_SAFETY_STOP_MINUTES:10}
    known-stop-radius-meters: ${TRIP_SAFETY_KNOWN_STOP_RADIUS_METERS:300}
    off-route-meters: ${TRIP_SAFETY_OFF_ROUTE_METERS:1000}
    off-route-minutes: ${TRIP_SAFETY_OFF_ROUTE_MINUTES:5}
    signal-lost-minutes: ${TRIP_SAFETY_SIGNAL_LOST_MINUTES:10}
    answer-minutes: ${TRIP_SAFETY_ANSWER_MINUTES:3}
    repeat-minutes: ${TRIP_SAFETY_REPEAT_MINUTES:60}
    watch-grace-minutes: ${TRIP_SAFETY_WATCH_GRACE_MINUTES:60}
  # Rider demand: drivers see a route once this many different riders want it, and get the 7 PM push
  # when it reaches min-riders-for-alert and matches their own trips. See DemandProperties.
  demand:
    min-riders-shown: ${DEMAND_MIN_RIDERS_SHOWN:3}
    min-riders-for-alert: ${DEMAND_MIN_RIDERS_FOR_ALERT:5}
    match-radius-km: ${DEMAND_MATCH_RADIUS_KM:5}
    max-alerts-per-week: ${DEMAND_MAX_ALERTS_PER_WEEK:3}
    # "3 others near you are going to Ajah": groups smaller than this are hidden; a search counts for this many minutes.
    nearby-min-riders: ${DEMAND_NEARBY_MIN_RIDERS:2}
    nearby-search-minutes: ${DEMAND_NEARBY_SEARCH_MINUTES:15}
  # Telling a driver who opened the app near waiting riders that they're going the driver's way.
  nearby-alert:
    enabled: ${NEARBY_ALERT_ENABLED:true}
    radius-meters: ${NEARBY_ALERT_RADIUS_METERS:500}
    presence-minutes: ${NEARBY_ALERT_PRESENCE_MINUTES:30}
    cooldown-minutes: ${NEARBY_ALERT_COOLDOWN_MINUTES:30}
    max-per-day: ${NEARBY_ALERT_MAX_PER_DAY:4}
