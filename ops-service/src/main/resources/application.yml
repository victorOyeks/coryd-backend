server:
  port: 9106
  forward-headers-strategy: framework
  servlet:
    context-path: /ops

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: ops-service
  # No database - see OpsServiceApplication. Kafka stays configured: common's health check reads
  # the listener registry, and ops alerts (SOS, issue reports) are expected to be consumed here.
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-ops-service
      auto-offset-reset: ${KAFKA_AUTO_OFFSET_RESET:latest}

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}
  profile:
    url: ${PROFILE_SERVICE_URL:http://localhost:9102/profile}
  trip:
    url: ${TRIP_SERVICE_URL:http://localhost:9103/trip}
  payment:
    url: ${PAYMENT_SERVICE_URL:http://localhost:9104/payment}
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:9105/notification}
  internal:
    api-key: ${INTERNAL_API_KEY}

# ops-service reads no platform setting itself, so it doesn't follow them (docs/ops-console/settings.md).
coryd:
  platform-settings:
    bootstrap:
      enabled: ${OPS_PLATFORM_SETTINGS_BOOTSTRAP:false}
    kafka:
      enabled: ${OPS_PLATFORM_SETTINGS_KAFKA:false}

# The console's live stream (GET /ops/stream) - see docs/ops-console/safety-support.md.
ops:
  stream:
    token-ttl-seconds: ${OPS_STREAM_TOKEN_TTL_SECONDS:60}
    max-connection-minutes: ${OPS_STREAM_MAX_CONNECTION_MINUTES:30}
    heartbeat-seconds: ${OPS_STREAM_HEARTBEAT_SECONDS:15}
    replay-size: ${OPS_STREAM_REPLAY_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
