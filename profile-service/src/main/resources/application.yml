server:
  port: 9102
  forward-headers-strategy: framework
  servlet:
    context-path: /profile

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: profile-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=profile
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: profile
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-profile-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}
  internal:
    api-key: ${INTERNAL_API_KEY}

# Driver identity checks (FRSC driver's licence, vehicle plate register). Off unless a key is
# set: a check that cannot run leaves the item pending for ops, which is exactly how it behaved
# before this existed. Test and live share one host; the key alone decides which you get.
prembly:
  enabled: ${PREMBLY_ENABLED:false}
  base-url: ${PREMBLY_BASE_URL:https://api.prembly.com}
  api-key: ${PREMBLY_API_KEY:}
  name-match-threshold: ${PREMBLY_NAME_MATCH_THRESHOLD:0.85}
  cross-check-vehicle-details: ${PREMBLY_CROSS_CHECK_VEHICLE:true}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
