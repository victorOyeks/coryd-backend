server:
  port: 9102
  forward-headers-strategy: framework
  servlet:
    context-path: /profile

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: profile-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coryd}?currentSchema=profile
    username: ${DB_USERNAME:coryd}
    password: ${DB_PASSWORD:coryd}
    hikari:
      # Kept low - this Postgres instance is shared with marketrun-ng and other
      # projects on a max_connections=100 server; 5 services x a default pool
      # of 10 each was enough on its own to exhaust it. idle-timeout/max-lifetime
      # make sure idle connections actually get reaped instead of piling up.
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: profile
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: coryd-profile-service
      auto-offset-reset: earliest

jwt:
  secret: ${JWT_SECRET:change-me-in-every-environment}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

services:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:9101/identity}
  internal:
    api-key: ${INTERNAL_API_KEY}

# Smile ID: the NIN + live selfie check (everyone) and the driver's licence check. Without a partner ID
# and API key, both checks answer "unavailable". Live by default (production); dev sets sandbox=true with a
# sandbox key, and every check is then sent as the test identity below so it always succeeds.
# Ops verification queue: a licence still out with Smile ID joins it after this many minutes, and ops can decide it -
# Smile ID's result overrides that decision when it arrives.
verification:
  provider-pending-queue-after-minutes: ${VERIFICATION_PROVIDER_PENDING_QUEUE_AFTER_MINUTES:10}

smile-id:
  partner-id: ${SMILE_ID_PARTNER_ID:}
  api-key: ${SMILE_ID_API_KEY:}
  sandbox: ${SMILE_ID_SANDBOX:false}
  callback-url: ${SMILE_ID_CALLBACK_URL:}
  id-type: ${SMILE_ID_ID_TYPE:NIN_V2}
  name-match-threshold: ${SMILE_ID_NAME_MATCH_THRESHOLD:0.85}
  # Below the threshold but sharing at least one name with the record: APPROVE (flagged for ops to review after) or OPS
  partial-name-match: ${SMILE_ID_PARTIAL_NAME_MATCH:APPROVE}
  # Sandbox only: every check is sent as this Smile ID test identity (Clearwater always comes back clear).
  test-identity:
    given-names: ${SMILE_ID_TEST_GIVEN_NAMES:Amina Fatou}
    last-name: ${SMILE_ID_TEST_LAST_NAME:Clearwater}
    email: ${SMILE_ID_TEST_EMAIL:amina.clearwater@example.com}
  # Drivers: NIN lookup by number (Enhanced KYC, no selfie) + their licence check, instead of the NIN + selfie check.
  drivers-use-nin-lookup: ${SMILE_ID_DRIVERS_USE_NIN_LOOKUP:true}
  nin-lookup-max-attempts: ${SMILE_ID_NIN_LOOKUP_MAX_ATTEMPTS:3}
  nin-lookup-cooldown-seconds: ${SMILE_ID_NIN_LOOKUP_COOLDOWN_SECONDS:30}
  # Set once per environment and never change it - fingerprints of NINs (for duplicate checks) depend on it.
  nin-fingerprint-key: ${NIN_FINGERPRINT_KEY:coryd-dev-only-nin-fingerprint-key}
  privacy-notice-url: ${SMILE_ID_PRIVACY_NOTICE_URL:https://coryd.ng/privacy}
  # Local test runs only - leave unset everywhere else.
  base-url-override: ${SMILE_ID_BASE_URL_OVERRIDE:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:placeholder}
  api-key: ${CLOUDINARY_API_KEY:placeholder}
  api-secret: ${CLOUDINARY_API_SECRET:placeholder}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  paths-to-exclude: /internal/**
  swagger-ui:
    path: /swagger-ui.html
